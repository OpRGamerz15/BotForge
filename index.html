: \"18 minutes ago\" },\n  { icon: \"🤖\", title: \"Created a Discord bot\", time: \"1 hour ago\" },\n  { icon: \"💻\", title: \"Opened Code Studio\", time: \"3 hours ago\" },\n  { icon: \"🔀\", title: \"Switched to NP GPT-5\", time: \"Yesterday\" },\n];\n\nlet state = {\n  convos: [],\n  activeId: null,\n  model: MODELS[0].id,\n  webSearch: false,\n  keys: [],\n};\n\n/* ---------- Helpers ---------- */\nconst $ = (sel, root = document) =\u003e root.querySelector(sel);\nconst $$ = (sel, root = document) =\u003e [...root.querySelectorAll(sel)];\nconst uid = () =\u003e Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\nconst esc = (s) =\u003e s.replace(/[\u0026\u003c\u003e\"']/g, (c) =\u003e ({ \"\u0026\": \"\u0026amp;\", \"\u003c\": \"\u0026lt;\", \"\u003e\": \"\u0026gt;\", '\"': \"\u0026quot;\", \"'\": \"\u0026#39;\" }[c]));\n\nfunction saveToLocalStorage() {\n  try {\n    localStorage.setItem(STORE.convos, JSON.stringify(state.convos));\n    localStorage.setItem(STORE.active, state.activeId || \"\");\n    localStorage.setItem(STORE.model, state.model);\n    localStorage.setItem(STORE.keys, JSON.stringify(state.keys));\n  } catch (e) { /* storage may be unavailable */ }\n}\n\nfunction loadFromLocalStorage() {\n  try {\n    state.convos = JSON.parse(localStorage.getItem(STORE.convos) || \"[]\");\n    state.activeId = localStorage.getItem(STORE.active) || null;\n    state.model = localStorage.getItem(STORE.model) || MODELS[0].id;\n    state.keys = JSON.parse(localStorage.getItem(STORE.keys) || \"[]\");\n  } catch (e) {\n    state.convos = []; state.activeId = null; state.model = MODELS[0].id; state.keys = [];\n  }\n  if (!MODELS.some((m) =\u003e m.id === state.model)) state.model = MODELS[0].id;\n  if (!state.convos.find((c) =\u003e c.id === state.activeId)) {\n    state.activeId = state.convos[0] ? state.convos[0].id : null;\n  }\n}\n\nfunction modelById(id) { return MODELS.find((m) =\u003e m.id === id) || MODELS[0]; }\nfunction activeConvo() { return state.convos.find((c) =\u003e c.id === state.activeId) || null; }\n\nfunction showToast(message, type = \"info\") {\n  const box = $(\"#toastContainer\");\n  const el = document.createElement(\"div\");\n  el.className = `toast ${type}`;\n  el.textContent = message;\n  box.appendChild(el);\n  setTimeout(() =\u003e { el.style.opacity = \"0\"; el.style.transform = \"translateY(-8px)\"; }, 2600);\n  setTimeout(() =\u003e el.remove(), 3000);\n}\n\n/* =========================================================\n   BACKGROUND — starfield\n   ========================================================= */\nfunction buildStarfield() {\n  const sf = $(\"#starfield\");\n  const count = window.innerWidth \u003c 768 ? 40 : 90;\n  let html = \"\";\n  for (let i = 0; i \u003c count; i++) {\n    const x = Math.random() * 100, y = Math.random() * 100;\n    const d = (Math.random() * 4 + 2).toFixed(1), delay = (Math.random() * 4).toFixed(1);\n    const s = (Math.random() * 1.5 + 1).toFixed(1);\n    html += `\u003cspan class=\"star\" style=\"left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-duration:${d}s;animation-delay:${delay}s\"\u003e\u003c/span\u003e`;\n  }\n  sf.innerHTML = html;\n}\n\n/* =========================================================\n   NAVIGATION / SCREEN SWITCHING\n   ========================================================= */\nfunction navigate(target) {\n  if (target === \"__settings\") {\n    navigate(\"dashboard\");\n    setTimeout(() =\u003e showToast(\"Use the moon icon (top-right) to toggle theme.\", \"info\"), 100);\n    return;\n  }\n  const current = $(\".screen.active\");\n  const next = $(`#screen-${target}`);\n  if (!next || (current \u0026\u0026 current.id === next.id)) return;\n\n  $$(\".nav-link\").forEach((l) =\u003e l.classList.toggle(\"active\", l.dataset.nav === target));\n\n  if (current) {\n    current.classList.add(\"leaving\");\n    setTimeout(() =\u003e {\n      current.classList.remove(\"active\", \"leaving\");\n      next.classList.add(\"active\");\n      afterNavigate(target);\n    }, 220);\n  } else {\n    next.classList.add(\"active\");\n    afterNavigate(target);\n  }\n  // close mobile menu\n  $(\"#navLinks\").classList.remove(\"open\");\n  closeMobileSidebar();\n  window.scrollTo({ top: 0, behavior: \"smooth\" });\n}\n\nfunction afterNavigate(target) {\n  if (target === \"chat\") setTimeout(() =\u003e $(\"#chatInput\") \u0026\u0026 $(\"#chatInput\").focus(), 120);\n  if (target === \"analytics\") renderCharts();\n  if (target === \"dashboard\") animateCounters();\n}\n\nfunction openDashboard() { navigate(\"dashboard\"); }\nfunction openChatStudio() { navigate(\"chat\"); }\nfunction openCodeStudio() { navigate(\"code\"); }\nfunction openImageStudio() { navigate(\"image\"); }\nfunction openFileStudio() { navigate(\"file\"); }\n\n/* =========================================================\n   DASHBOARD RENDER\n   ========================================================= */\nfunction renderDashboard() {\n  // Quick actions\n  $(\"#quickGrid\").innerHTML = QUICK_ACTIONS.map((a) =\u003e `\n    \u003cbutton class=\"quick-card\" data-nav=\"${a.nav}\"\u003e\n      \u003cdiv class=\"quick-icon\"\u003e${a.icon}\u003c/div\u003e\n      \u003ch3\u003e${a.title}\u003c/h3\u003e\n      \u003cp\u003e${a.desc}\u003c/p\u003e\n    \u003c/button\u003e`).join(\"\");\n\n  // Stats\n  $(\"#statsGrid\").innerHTML = STATS.map((s) =\u003e `\n    \u003cdiv class=\"stat-card\"\u003e\n      \u003cdiv class=\"stat-value\" data-target=\"${s.value}\"\u003e0\u003c/div\u003e\n      \u003cdiv class=\"stat-label\"\u003e${s.label}\u003c/div\u003e\n    \u003c/div\u003e`).join(\"\");\n\n  // Activity\n  $(\"#activityTimeline\").innerHTML = ACTIVITY.map((a) =\u003e `\n    \u003cdiv class=\"timeline-item\"\u003e\n      \u003cdiv class=\"timeline-dot\"\u003e${a.icon}\u003c/div\u003e\n      \u003cdiv\u003e\u003ch4\u003e${a.title}\u003c/h4\u003e\u003cspan\u003e${a.time}\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e`).join(\"\");\n\n  // Models showcase\n  $(\"#modelsGrid\").innerHTML = MODEL_SHOWCASE.map((m) =\u003e `\n    \u003cdiv class=\"model-card\"\u003e\n      \u003ch4\u003e${m.name}\u003c/h4\u003e\n      \u003cdiv class=\"tags\"\u003e${m.tags.map((t) =\u003e `\u003cspan class=\"tag\"\u003e${t}\u003c/span\u003e`).join(\"\")}\u003c/div\u003e\n    \u003c/div\u003e`).join(\"\");\n\n  animateCounters();\n}\n\nfunction animateCounters() {\n  $$(\".stat-value\").forEach((el) =\u003e {\n    const target = parseInt(el.dataset.target, 10) || 0;\n    const dur = 1400, start = performance.now();\n    function step(now) {\n      const p = Math.min((now - start) / dur, 1);\n      const eased = 1 - Math.pow(1 - p, 3);\n      el.textContent = Math.round(target * eased).toLocaleString();\n      if (p \u003c 1) requestAnimationFrame(step);\n    }\n    requestAnimationFrame(step);\n  });\n}\n\n/* =========================================================\n   CHAT — conversations\n   ========================================================= */\nfunction createConversation(focus = true) {\n  const convo = { id: uid(), title: \"New Conversation\", model: state.model, pinned: false, favorite: false, messages: [], created: Date.now() };\n  state.convos.unshift(convo);\n  state.activeId = convo.id;\n  saveToLocalStorage();\n  renderConversations();\n  renderMessages();\n  $(\"#chatTitleInput\").value = convo.title;\n  if (focus) $(\"#chatInput\").focus();\n  return convo;\n}\n\nfunction switchConversation(id) {\n  state.activeId = id;\n  saveToLocalStorage();\n  renderConversations();\n  renderMessages();\n  const c = activeConvo();\n  if (c) { state.model = c.model || state.model; renderModelSelector(); }\n  closeMobileSidebar();\n}\n\nfunction deleteConversation(id) {\n  state.convos = state.convos.filter((c) =\u003e c.id !== id);\n  if (state.activeId === id) state.activeId = state.convos[0] ? state.convos[0].id : null;\n  saveToLocalStorage();\n  renderConversations();\n  renderMessages();\n  showToast(\"Conversation deleted.\", \"warn\");\n}\n\nfunction renameConversation(id) {\n  const c = state.convos.find((x) =\u003e x.id === id);\n  if (!c) return;\n  const name = prompt(\"Rename conversation:\", c.title);\n  if (name \u0026\u0026 name.trim()) {\n    c.title = name.trim();\n    saveToLocalStorage();\n    renderConversations();\n    if (id === state.activeId) $(\"#chatTitleInput\").value = c.title;\n    showToast(\"Renamed.\", \"success\");\n  }\n}\n\nfunction pinConversation(id) {\n  const c = state.convos.find((x) =\u003e x.id === id);\n  if (!c) return;\n  c.pinned = !c.pinned;\n  saveToLocalStorage();\n  renderConversations();\n}\n\nfunction favoriteConversation(id) {\n  const c = state.convos.find((x) =\u003e x.id === id);\n  if (!c) return;\n  c.favorite = !c.favorite;\n  saveToLocalStorage();\n  renderConversations();\n}\n\nfunction filterConversations() { renderConversations(); }\n\nfunction convItemHTML(c) {\n  return `\u003cdiv class=\"conv-item ${c.id === state.activeId ? \"active\" : \"\"}\" data-id=\"${c.id}\"\u003e\n    \u003cspan class=\"conv-name\"\u003e${esc(c.title)}\u003c/span\u003e\n    \u003cspan class=\"conv-actions\"\u003e\n      \u003cbutton data-act=\"pin\" title=\"Pin\"\u003e${c.pinned ? \"📌\" : \"📍\"}\u003c/button\u003e\n      \u003cbutton data-act=\"fav\" title=\"Favorite\"\u003e${c.favorite ? \"⭐\" : \"☆\"}\u003c/button\u003e\n      \u003cbutton data-act=\"rename\" title=\"Rename\"\u003e✎\u003c/button\u003e\n      \u003cbutton data-act=\"del\" title=\"Delete\"\u003e🗑\u003c/button\u003e\n    \u003c/span\u003e\n  \u003c/div\u003e`;\n}\n\nfunction renderConversations() {\n  const q = ($(\"#convSearch\").value || \"\").toLowerCase().trim();\n  const match = (c) =\u003e !q || c.title.toLowerCase().includes(q) ||\n    c.messages.some((m) =\u003e m.text.toLowerCase().includes(q));\n  const list = state.convos.filter(match);\n\n  const pinned = list.filter((c) =\u003e c.pinned);\n  const fav = list.filter((c) =\u003e c.favorite \u0026\u0026 !c.pinned);\n  const recent = list.filter((c) =\u003e !c.pinned \u0026\u0026 !c.favorite);\n\n  const fill = (arr, empty) =\u003e arr.length ? arr.map(convItemHTML).join(\"\") : `\u003cdiv class=\"conv-empty\"\u003e${empty}\u003c/div\u003e`;\n  $(\"#pinnedList\").innerHTML = fill(pinned, \"No pinned chats\");\n  $(\"#favList\").innerHTML = fill(fav, \"No favorites\");\n  $(\"#recentList\").innerHTML = fill(recent, q ? \"No matches\" : \"No recent chats\");\n}\n\n/* ---------- Messages ---------- */\nfunction renderMessages() {\n  const c = activeConvo();\n  const box = $(\"#messages\");\n  if (!c) {\n    box.innerHTML = `\u003cdiv class=\"chat-empty\"\u003e\n      \u003cdiv class=\"orb\"\u003e\u003cdiv class=\"orb-core\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-1\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-2\"\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003ch3\u003eStart a new conversation\u003c/h3\u003e\n      \u003cp\u003eAsk Nexora anything — coding help, ideas, explanations, and more.\u003c/p\u003e\n    \u003c/div\u003e`;\n    $(\"#chatTitleInput\").value = \"New Conversation\";\n    return;\n  }\n  $(\"#chatTitleInput\").value = c.title;\n  if (!c.messages.length) {\n    box.innerHTML = `\u003cdiv class=\"chat-empty\"\u003e\n      \u003cdiv class=\"orb\"\u003e\u003cdiv class=\"orb-core\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-1\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-2\"\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003ch3\u003eHow can I help you today?\u003c/h3\u003e\n      \u003cp\u003eType a message below to begin. Press Enter to send, Shift+Enter for a new line.\u003c/p\u003e\n    \u003c/div\u003e`;\n    return;\n  }\n  box.innerHTML = c.messages.map(messageHTML).join(\"\");\n  bindMessageActions();\n  scrollMessages();\n}\n\nfunction messageHTML(m) {\n  if (m.role === \"user\") {\n    return `\u003cdiv class=\"msg user\" data-mid=\"${m.id}\"\u003e\n      \u003cdiv class=\"msg-avatar\"\u003eNX\u003c/div\u003e\n      \u003cdiv class=\"msg-body\"\u003e\n        \u003cdiv class=\"msg-bubble\"\u003e${formatContent(m.text)}\u003c/div\u003e\n        \u003cdiv class=\"msg-time\"\u003e${formatTime(m.ts)}\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e`;\n  }\n  return `\u003cdiv class=\"msg ai\" data-mid=\"${m.id}\"\u003e\n    \u003cdiv class=\"msg-avatar\"\u003e◆\u003c/div\u003e\n    \u003cdiv class=\"msg-body\"\u003e\n      \u003cdiv class=\"msg-model-badge\"\u003e${esc(m.model || \"NP GPT-5\")}\u003c/div\u003e\n      \u003cdiv class=\"msg-bubble\"\u003e${formatContent(m.text)}\u003c/div\u003e\n      \u003cdiv class=\"msg-actions\"\u003e\n        \u003cbutton data-act=\"copy\"\u003e⧉ Copy\u003c/button\u003e\n        \u003cbutton data-act=\"regen\"\u003e↻ Regenerate\u003c/button\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"msg-time\"\u003e${formatTime(m.ts)}\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e`;\n}\n\nfunction formatTime(ts) {\n  const d = new Date(ts || Date.now());\n  return d.toLocaleTimeString([], { hour: \"2-digit\", minute: \"2-digit\" });\n}\n\n/* Lightweight markdown-ish formatter (safe: escapes first) */\nfunction formatContent(raw) {\n  const parts = [];\n  const regex = /```(\\w*)\\n?([\\s\\S]*?)```/g;\n  let last = 0, m;\n  while ((m = regex.exec(raw)) !== null) {\n    if (m.index \u003e last) parts.push({ type: \"text\", value: raw.slice(last, m.index) });\n    parts.push({ type: \"code\", lang: m[1] || \"text\", value: m[2] });\n    last = regex.lastIndex;\n  }\n  if (last \u003c raw.length) parts.push({ type: \"text\", value: raw.slice(last) });\n\n  return parts.map((p) =\u003e {\n    if (p.type === \"code\") {\n      return `\u003cpre\u003e\u003cdiv class=\"code-head\"\u003e\u003cspan\u003e${esc(p.lang)}\u003c/span\u003e\u003cbutton class=\"mini-copy\" data-code=\"${encodeURIComponent(p.value)}\"\u003eCopy\u003c/button\u003e\u003c/div\u003e\u003ccode\u003e${esc(p.value.replace(/\\n$/, \"\"))}\u003c/code\u003e\u003c/pre\u003e`;\n    }\n    return inlineFormat(p.value);\n  }).join(\"\");\n}\n\nfunction inlineFormat(text) {\n  const lines = text.split(\"\\n\");\n  let html = \"\", inList = false;\n  for (let line of lines) {\n    let t = esc(line);\n    t = t.replace(/`([^`]+)`/g, \"\u003ccode\u003e$1\u003c/code\u003e\");\n    t = t.replace(/\\*\\*([^*]+)\\*\\*/g, \"\u003cstrong\u003e$1\u003c/strong\u003e\");\n    if (/^\\s*[-*]\\s+/.test(line)) {\n      if (!inList) { html += \"\u003cul\u003e\"; inList = true; }\n      html += `\u003cli\u003e${t.replace(/^\\s*[-*]\\s+/, \"\")}\u003c/li\u003e`;\n    } else {\n      if (inList) { html += \"\u003c/ul\u003e\"; inList = false; }\n      if (t.trim()) html += `\u003cp\u003e${t}\u003c/p\u003e`;\n    }\n  }\n  if (inList) html += \"\u003c/ul\u003e\";\n  return html;\n}\n\nfunction scrollMessages() {\n  const box = $(\"#messages\");\n  box.scrollTop = box.scrollHeight;\n}\n\nfunction addUserMessage(text) {\n  const c = activeConvo();\n  if (!c) return;\n  const msg = { id: uid(), role: \"user\", text, ts: Date.now() };\n  c.messages.push(msg);\n  if (c.messages.filter((x) =\u003e x.role === \"user\").length === 1) {\n    c.title = text.slice(0, 40) + (text.length \u003e 40 ? \"…\" : \"\");\n    $(\"#chatTitleInput\").value = c.title;\n  }\n  saveToLocalStorage();\n  renderMessages();\n  renderConversations();\n}\n\nfunction addAIMessage(text) {\n  const c = activeConvo();\n  if (!c) return;\n  const msg = { id: uid(), role: \"ai\", text, model: modelById(state.model).name, ts: Date.now() };\n  c.messages.push(msg);\n  saveToLocalStorage();\n  renderMessages();\n}\n\nlet typingEl = null;\nfunction showTypingIndicator() {\n  const box = $(\"#messages\");\n  const wrap = document.createElement(\"div\");\n  wrap.className = \"msg ai\";\n  wrap.id = \"typingIndicator\";\n  wrap.innerHTML = `\u003cdiv class=\"msg-avatar\"\u003e◆\u003c/div\u003e\u003cdiv class=\"msg-body\"\u003e\u003cdiv class=\"msg-bubble\"\u003e\u003cdiv class=\"typing\"\u003e\u003cspan\u003e\u003c/span\u003e\u003cspan\u003e\u003c/span\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`;\n  box.appendChild(wrap);\n  typingEl = wrap;\n  scrollMessages();\n}\nfunction removeTypingIndicator() {\n  if (typingEl) { typingEl.remove(); typingEl = null; }\n}\n\nlet sending = false;\nfunction sendMessage() {\n  const input = $(\"#chatInput\");\n  const text = input.value.trim();\n  if (!text || sending) return;\n  sending = true;\n  if (!activeConvo()) createConversation(false);\n\n  addUserMessage(text);\n  input.value = \"\";\n  autoGrow(input);\n  $(\"#sendBtn\").disabled = true;\n\n  showTypingIndicator();\n  const delay = 500 + Math.random() * 500;\n  setTimeout(() =\u003e {\n    removeTypingIndicator();\n    addAIMessage(generateResponse(text));\n    renderConversations();\n    sending = false;\n    $(\"#sendBtn\").disabled = false;\n    input.focus();\n  }, delay);\n}\n\nfunction copyMessage(mid) {\n  const c = activeConvo();\n  const m = c \u0026\u0026 c.messages.find((x) =\u003e x.id === mid);\n  if (!m) return;\n  navigator.clipboard.writeText(m.text).then(() =\u003e showToast(\"Message copied.\", \"success\"));\n}\n\nfunction regenerateMessage(mid) {\n  const c = activeConvo();\n  if (!c) return;\n  const idx = c.messages.findIndex((x) =\u003e x.id === mid);\n  if (idx \u003c 0) return;\n  let userText = \"\";\n  for (let i = idx - 1; i \u003e= 0; i--) { if (c.messages[i].role === \"user\") { userText = c.messages[i].text; break; } }\n  c.messages.splice(idx);\n  saveToLocalStorage();\n  renderMessages();\n  showTypingIndicator();\n  setTimeout(() =\u003e {\n    removeTypingIndicator();\n    addAIMessage(generateResponse(userText || \"Continue.\"));\n  }, 600);\n}\n\nfunction bindMessageActions() {\n  $$(\"#messages .msg-actions button\").forEach((btn) =\u003e {\n    btn.onclick = () =\u003e {\n      const mid = btn.closest(\".msg\").dataset.mid;\n      if (btn.dataset.act === \"copy\") copyMessage(mid);\n      if (btn.dataset.act === \"regen\") regenerateMessage(mid);\n    };\n  });\n  $$(\"#messages .mini-copy\").forEach((btn) =\u003e {\n    btn.onclick = () =\u003e {\n      navigator.clipboard.writeText(decodeURIComponent(btn.dataset.code)).then(() =\u003e showToast(\"Code copied.\", \"success\"));\n    };\n  });\n}\n\n/* ---------- Local response generator (no backend, no fake status text) ---------- */\nfunction generateResponse(input) {\n  const q = input.toLowerCase();\n  const model = modelById(state.model).name;\n  const web = state.webSearch ? \" Based on current web sources, \" : \" \";\n\n  if (/\\b(hi|hello|hey|yo)\\b/.test(q) \u0026\u0026 q.length \u003c 24) {\n    return `Hello! I'm running on **${model}**. Ask me to explain a concept, write code, brainstorm ideas, or draft text.`;\n  }\n  if (/\\b(code|function|component|script|program|write|build|snippet)\\b/.test(q)) {\n    if (/python/.test(q)) {\n      return `Here's a Python example:\\n\\n\\`\\`\\`python\\ndef greet(name: str) -\u003e str:\\n    return f\"Hello, {name}! Welcome to Nexora.\"\\n\\nif __name__ == \"__main__\":\\n    print(greet(\"Developer\"))\\n\\`\\`\\`\\n\\nYou can extend this with argument parsing or a loop. Want a specific variation?`;\n    }\n    if (/html|page|website/.test(q)) {\n      return `A minimal HTML starting point:\\n\\n\\`\\`\\`html\\n\u003c!DOCTYPE html\u003e\\n\u003chtml lang=\"en\"\u003e\\n  \u003chead\u003e\u003cmeta charset=\"UTF-8\" /\u003e\u003ctitle\u003eMy Page\u003c/title\u003e\u003c/head\u003e\\n  \u003cbody\u003e\\n    \u003ch1\u003eHello from Nexora\u003c/h1\u003e\\n  \u003c/body\u003e\\n\u003c/html\u003e\\n\\`\\`\\`\\n\\nPaste this into **Code Studio** to preview it live.`;\n    }\n    return `Here's a JavaScript utility you can drop in:\\n\\n\\`\\`\\`javascript\\nfunction debounce(fn, wait = 300) {\\n  let t;\\n  return (...args) =\u003e {\\n    clearTimeout(t);\\n    t = setTimeout(() =\u003e fn(...args), wait);\\n  };\\n}\\n\\`\\`\\`\\n\\nTell me the exact behavior you want and I'll tailor it.`;\n  }\n  if (/\\b(explain|what is|how does|why|difference)\\b/.test(q)) {\n    return `${web}here's a clear breakdown:\\n\\n- **Core idea:** ${input.replace(/^(explain|what is|how does|why)\\s*/i, \"\").replace(/\\?$/, \"\") || \"the topic\"} can be understood as a system of related parts.\\n- **Why it matters:** it affects how you design and reason about the problem.\\n- **In practice:** start simple, verify each step, then optimize.\\n\\nWant me to go deeper on any of these points?`;\n  }\n  if (/\\b(idea|brainstorm|suggest|name|names)\\b/.test(q)) {\n    return `Here are a few directions to consider:\\n\\n- A focused, single-purpose approach that's easy to ship.\\n- A modular version that scales as requirements grow.\\n- An experimental angle that differentiates you.\\n\\nWhich of these should I expand into a concrete plan?`;\n  }\n  if (/\\b(summary|summarize|tl;dr)\\b/.test(q)) {\n    return `**Summary:** ${input.replace(/summarize|summary|tl;dr/gi, \"\").trim() || \"your request\"} comes down to three things — clarity of goal, the smallest viable step, and a way to measure the result.`;\n  }\n  return `${web}here's my take on \"${esc(input.slice(0, 120))}\":\\n\\nThe key is to break it into concrete steps and validate each one. I can turn this into **code**, a **plan**, or a **detailed explanation** — just tell me which format works best.`;\n}\n\n/* ---------- Export / Import ---------- */\nfunction exportConversation() {\n  if (!state.convos.length) { showToast(\"Nothing to export yet.\", \"warn\"); return; }\n  const data = JSON.stringify(state.convos, null, 2);\n  const blob = new Blob([data], { type: \"application/json\" });\n  downloadBlob(blob, \"nexora-conversations.json\");\n  showToast(\"Conversations exported.\", \"success\");\n}\nfunction importConversation(json) {\n  try {\n    const parsed = JSON.parse(json);\n    if (Array.isArray(parsed)) {\n      state.convos = parsed.concat(state.convos);\n      saveToLocalStorage();\n      renderConversations();\n      renderMessages();\n      showToast(\"Conversations imported.\", \"success\");\n    }\n  } catch (e) { showToast(\"Invalid import file.\", \"warn\"); }\n}\nfunction downloadBlob(blob, filename) {\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url; a.download = filename; a.click();\n  setTimeout(() =\u003e URL.revokeObjectURL(url), 1000);\n}\n\n/* ---------- Model selector ---------- */\nfunction renderModelSelector() {\n  const menu = $(\"#modelMenu\");\n  menu.innerHTML = MODELS.map((m) =\u003e `\n    \u003cbutton class=\"model-option ${m.id === state.model ? \"selected\" : \"\"}\" data-id=\"${m.id}\" role=\"option\"\u003e\n      \u003cspan\u003e${m.name}\u003c/span\u003e\u003csmall\u003e${m.tag}\u003c/small\u003e\n    \u003c/button\u003e`).join(\"\");\n  $(\"#currentModelLabel\").textContent = modelById(state.model).name;\n  $$(\"#modelMenu .model-option\").forEach((opt) =\u003e {\n    opt.onclick = () =\u003e { switchModel(opt.dataset.id); toggleModelMenu(false); };\n  });\n}\nfunction switchModel(id) {\n  state.model = id;\n  const c = activeConvo();\n  if (c) c.model = id;\n  saveToLocalStorage();\n  renderModelSelector();\n  showToast(`Switched to ${modelById(id).name}.`, \"info\");\n}\nfunction toggleModelMenu(force) {\n  const menu = $(\"#modelMenu\");\n  const open = force !== undefined ? force : !menu.classList.contains(\"open\");\n  menu.classList.toggle(\"open\", open);\n  $(\"#modelSelectorBtn\").setAttribute(\"aria-expanded\", String(open));\n}\n\n/* ---------- Textarea auto-grow ---------- */\nfunction autoGrow(el) {\n  el.style.height = \"auto\";\n  el.style.height = Math.min(el.scrollHeight, 180) + \"px\";\n}\n\n/* ---------- Mobile sidebar ---------- */\nfunction closeMobileSidebar() {\n  $(\"#chatSidebar\").classList.remove(\"open\");\n  $(\"#sidebarScrim\").classList.remove(\"show\");\n}\n\n/* =========================================================\n   THEME\n   ========================================================= */\nfunction toggleTheme() {\n  const html = document.documentElement;\n  const next = html.getAttribute(\"data-theme\") === \"dark\" ? \"light\" : \"dark\";\n  html.setAttribute(\"data-theme\", next);\n  localStorage.setItem(STORE.theme, next);\n  $(\"#navbar\") \u0026\u0026 document.querySelector('meta[name=\"theme-color\"]').setAttribute(\"content\", next === \"dark\" ? \"#050816\" : \"#eef1f8\");\n  showToast(`${next[0].toUpperCase() + next.slice(1)} theme enabled.`, \"info\");\n}\nfunction restoreTheme() {\n  const t = localStorage.getItem(STORE.theme) || \"dark\";\n  document.documentElement.setAttribute(\"data-theme\", t);\n}\n\n/* =========================================================\n   CODE STUDIO\n   ========================================================= */\nconst codeFiles = {\n  \"index.html\": { lang: \"html\", value: `\u003c!DOCTYPE html\u003e\\n\u003chtml\u003e\\n  \u003chead\u003e\\n    \u003clink rel=\"stylesheet\" href=\"style.css\" /\u003e\\n  \u003c/head\u003e\\n  \u003cbody\u003e\\n    \u003ch1\u003eHello, Nexora!\u003c/h1\u003e\\n    \u003cbutton id=\"btn\"\u003eClick me\u003c/button\u003e\\n    \u003cscript src=\"script.js\"\u003e\u003c\\/script\u003e\\n  \u003c/body\u003e\\n\u003c/html\u003e` },\n  \"style.css\": { lang: \"css\", value: `body {\\n  font-family: system-ui, sans-serif;\\n  display: grid;\\n  place-items: center;\\n  min-height: 100vh;\\n  background: #0b1020;\\n  color: #fff;\\n}\\nbutton {\\n  padding: .6rem 1.2rem;\\n  border-radius: 10px;\\n  border: none;\\n  background: #8b5cf6;\\n  color: #fff;\\n  cursor: pointer;\\n}` },\n  \"script.js\": { lang: \"javascript\", value: `document.getElementById(\"btn\").addEventListener(\"click\", () =\u003e {\\n  alert(\"Hello from Nexora Code Studio!\");\\n});` },\n  \"main.py\": { lang: \"python\", value: `def greet(name):\\n    return f\"Hello, {name}!\"\\n\\nprint(greet(\"Nexora\"))` },\n  \"data.json\": { lang: \"json\", value: `{\\n  \"app\": \"Nexora AI\",\\n  \"version\": \"1.0.0\",\\n  \"features\": [\"chat\", \"code\", \"images\"]\\n}` },\n  \"notes.md\": { lang: \"markdown\", value: `# Nexora Notes\\n\\n- Build the dashboard\\n- Wire the chat\\n- Ship it on GitHub Pages` },\n};\nlet activeFile = \"index.html\";\n\nfunction renderCodeStudio() {\n  const names = Object.keys(codeFiles);\n  $(\"#fileTree\").innerHTML = names.map((n) =\u003e `\u003cli class=\"${n === activeFile ? \"active\" : \"\"}\" data-file=\"${n}\"\u003e📄 ${n}\u003c/li\u003e`).join(\"\");\n  $(\"#codeTabs\").innerHTML = names.map((n) =\u003e `\u003cbutton class=\"code-tab ${n === activeFile ? \"active\" : \"\"}\" data-file=\"${n}\"\u003e${n}\u003c/button\u003e`).join(\"\");\n  $(\"#codeEditor\").value = codeFiles[activeFile].value;\n  updateLineNumbers();\n  runCode();\n}\nfunction selectFile(name) {\n  activeFile = name;\n  renderCodeStudio();\n}\nfunction updateLineNumbers() {\n  const lines = $(\"#codeEditor\").value.split(\"\\n\").length;\n  $(\"#lineNumbers\").innerHTML = Array.from({ length: lines }, (_, i) =\u003e i + 1).join(\"\u003cbr\u003e\");\n}\nfunction runCode() {\n  const html = codeFiles[\"index.html\"].value\n    .replace(/\u003clink[^\u003e]*href=\"style\\.css\"[^\u003e]*\u003e/, `\u003cstyle\u003e${codeFiles[\"style.css\"].value}\u003c\\/style\u003e`)\n    .replace(/\u003cscript[^\u003e]*src=\"script\\.js\"[^\u003e]*\u003e\u003c\\/script\u003e/, `\u003cscript\u003e${codeFiles[\"script.js\"].value}\u003c\\/script\u003e`);\n  $(\"#previewFrame\").srcdoc = html;\n}\n\n/* =========================================================\n   IMAGE STUDIO\n   ========================================================= */\nfunction hashStr(s) { let h = 0; for (let i = 0; i \u003c s.length; i++) { h = (h \u003c\u003c 5) - h + s.charCodeAt(i); h |= 0; } return Math.abs(h); }\n\nfunction styleColors(style, seed) {\n  const palettes = {\n    Realistic: [\"#4b6cb7\", \"#182848\"], Anime: [\"#ff9a9e\", \"#a18cd1\"], Minecraft: [\"#43a047\", \"#795548\"],\n    \"Pixel Art\": [\"#ff6b6b\", \"#4ecdc4\"], Fantasy: [\"#8e2de2\", \"#4a00e0\"], Cyberpunk: [\"#f72585\", \"#4361ee\"],\n    Cinematic: [\"#ff512f\", \"#dd2476\"], Cartoon: [\"#f7971e\", \"#ffd200\"],\n  };\n  const base = palettes[style] || [\"#8b5cf6\", \"#06b6d4\"];\n  const angle = seed % 360;\n  return `linear-gradient(${angle}deg, ${base[0]}, ${base[1]})`;\n}\n\nfunction styleArt(style) {\n  const map = {\n    Realistic: \"realistic\", Anime: \"anime\", Minecraft: \"minecraft\", \"Pixel Art\": \"pixel\",\n    Fantasy: \"fantasy\", Cyberpunk: \"cyberpunk\", Cinematic: \"cinematic\", Cartoon: \"cartoon\",\n  };\n  return `images/style-${map[style] || \"realistic\"}.png`;\n}\n\nfunction generateImages() {\n  const prompt = $(\"#imagePrompt\").value.trim();\n  const style = $(\"#imageStyle\").value;\n  if (!prompt) { showToast(\"Enter a prompt first.\", \"warn\"); $(\"#imagePrompt\").focus(); return; }\n\n  const results = $(\"#imageResults\");\n  results.innerHTML = \"\";\n  const cards = [];\n  for (let i = 0; i \u003c 4; i++) {\n    const card = document.createElement(\"div\");\n    card.className = \"image-card loading\";\n    card.innerHTML = `\u003cdiv class=\"art\"\u003e\u003c/div\u003e`;\n    results.appendChild(card);\n    cards.push(card);\n  }\n  const art = styleArt(style);\n  cards.forEach((card, i) =\u003e {\n    setTimeout(() =\u003e {\n      const seed = hashStr(prompt + style + i);\n      const grad = styleColors(style, seed + i * 47);\n      const hue = (seed % 60) - 30;\n      const scale = 1 + ((seed % 12) / 100);\n      card.classList.remove(\"loading\");\n      card.innerHTML = `\n        \u003cdiv class=\"art\"\u003e\n          \u003cimg src=\"${art}\" alt=\"${esc(style)} concept art for: ${esc(prompt)}\"\n               style=\"filter:hue-rotate(${hue}deg) saturate(1.1);transform:scale(${scale});\" /\u003e\n          \u003cdiv class=\"art-tint\" style=\"background:${grad}\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"img-meta\"\u003e\n          \u003cspan\u003e${style} · v${i + 1}\u003c/span\u003e\n          \u003cbutton class=\"img-download\"\u003e⭳ Save\u003c/button\u003e\n        \u003c/div\u003e`;\n      card.querySelector(\".img-download\").onclick = () =\u003e downloadImageCard(card, prompt, i);\n    }, 500 + i * 350);\n  });\n\n  saveImagePrompt(prompt, style);\n  showToast(\"Rendering 4 variations…\", \"info\");\n}\n\nfunction downloadImageCard(card, prompt, i) {\n  const imgEl = card.querySelector(\".art img\");\n  const cvs = document.createElement(\"canvas\");\n  cvs.width = 512; cvs.height = 512;\n  const ctx = cvs.getContext(\"2d\");\n  const render = () =\u003e {\n    try { ctx.drawImage(imgEl, 0, 0, 512, 512); } catch (e) {\n      ctx.fillStyle = \"#8b5cf6\"; ctx.fillRect(0, 0, 512, 512);\n    }\n    const bar = ctx.createLinearGradient(0, 440, 0, 512);\n    bar.addColorStop(0, \"rgba(0,0,0,0)\"); bar.addColorStop(1, \"rgba(0,0,0,0.75)\");\n    ctx.fillStyle = bar; ctx.fillRect(0, 440, 512, 72);\n    ctx.fillStyle = \"rgba(255,255,255,0.9)\"; ctx.font = \"600 20px sans-serif\";\n    ctx.fillText(\"Nexora AI\", 24, 490);\n    cvs.toBlob((blob) =\u003e downloadBlob(blob, `nexora-${i + 1}.png`));\n    showToast(\"Image saved.\", \"success\");\n  };\n  if (imgEl \u0026\u0026 imgEl.complete) render();\n  else if (imgEl) imgEl.addEventListener(\"load\", render, { once: true });\n}\n\nfunction saveImagePrompt(prompt, style) {\n  let hist = [];\n  try { hist = JSON.parse(localStorage.getItem(STORE.imgHistory) || \"[]\"); } catch (e) {}\n  hist.unshift({ prompt, style, ts: Date.now() });\n  hist = hist.slice(0, 15);\n  localStorage.setItem(STORE.imgHistory, JSON.stringify(hist));\n  renderPromptHistory();\n}\nfunction renderPromptHistory() {\n  let hist = [];\n  try { hist = JSON.parse(localStorage.getItem(STORE.imgHistory) || \"[]\"); } catch (e) {}\n  const box = $(\"#promptHistory\");\n  if (!hist.length) { box.innerHTML = `\u003cdiv class=\"conv-empty\"\u003eNo prompts yet.\u003c/div\u003e`; return; }\n  box.innerHTML = hist.map((h) =\u003e `\u003cbutton class=\"prompt-history-item\" data-prompt=\"${esc(h.prompt)}\" data-style=\"${esc(h.style)}\"\u003e${esc(h.prompt.slice(0, 48))}\u003c/button\u003e`).join(\"\");\n  $$(\"#promptHistory .prompt-history-item\").forEach((b) =\u003e {\n    b.onclick = () =\u003e { $(\"#imagePrompt\").value = b.dataset.prompt; $(\"#imageStyle\").value = b.dataset.style; };\n  });\n}\n\n/* =========================================================\n   FILE INTELLIGENCE\n   ========================================================= */\nlet files = [];\nfunction fileIcon(type, name) {\n  const ext = (name.split(\".\").pop() || \"\").toLowerCase();\n  if (/png|jpg|jpeg|gif|webp/.test(ext)) return \"🖼️\";\n  if (ext === \"pdf\") return \"📕\";\n  if (/docx?|txt|md/.test(ext)) return \"📝\";\n  if (ext === \"csv\") return \"📊\";\n  if (ext === \"json\") return \"🧾\";\n  return \"📄\";\n}\nfunction humanSize(bytes) {\n  if (bytes \u003c 1024) return bytes + \" B\";\n  if (bytes \u003c 1024 * 1024) return (bytes / 1024).toFixed(1) + \" KB\";\n  return (bytes / 1024 / 1024).toFixed(1) + \" MB\";\n}\nfunction handleFiles(fileList) {\n  [...fileList].forEach((f) =\u003e {\n    const entry = { id: uid(), name: f.name, size: f.size, type: f.type, ext: (f.name.split(\".\").pop() || \"\").toLowerCase(), content: \"\", isText: false };\n    if (/text|json|csv|javascript/.test(f.type) || /txt|md|csv|json|js|css|html/.test(entry.ext)) {\n      const reader = new FileReader();\n      reader.onload = (e) =\u003e { entry.content = e.target.result; entry.isText = true; renderFileList(); };\n      reader.readAsText(f);\n    }\n    files.push(entry);\n  });\n  renderFileList();\n  showToast(`${fileList.length} file(s) added.`, \"success\");\n}\nlet activeFileId = null;\nfunction renderFileList() {\n  const q = ($(\"#fileSearch\").value || \"\").toLowerCase();\n  const box = $(\"#fileList\");\n  const list = files.filter((f) =\u003e f.name.toLowerCase().includes(q));\n  if (!list.length) { box.innerHTML = `\u003cdiv class=\"conv-empty\"\u003e${files.length ? \"No matches.\" : \"No files yet.\"}\u003c/div\u003e`; return; }\n  box.innerHTML = list.map((f) =\u003e `\n    \u003cdiv class=\"file-item ${f.id === activeFileId ? \"active\" : \"\"}\" data-id=\"${f.id}\"\u003e\n      \u003cdiv class=\"file-ico\"\u003e${fileIcon(f.type, f.name)}\u003c/div\u003e\n      \u003cdiv class=\"file-meta\"\u003e\u003ch4\u003e${esc(f.name)}\u003c/h4\u003e\u003cspan\u003e${humanSize(f.size)} · ${f.ext.toUpperCase()}\u003c/span\u003e\u003c/div\u003e\n      \u003cbutton class=\"file-remove\" data-remove=\"${f.id}\" title=\"Remove\"\u003e✕\u003c/button\u003e\n    \u003c/div\u003e`).join(\"\");\n  $$(\"#fileList .file-item\").forEach((el) =\u003e {\n    el.onclick = (e) =\u003e { if (e.target.dataset.remove) return; previewFile(el.dataset.id); };\n  });\n  $$(\"#fileList .file-remove\").forEach((b) =\u003e {\n    b.onclick = (e) =\u003e { e.stopPropagation(); removeFile(b.dataset.remove); };\n  });\n}\nfunction removeFile(id) {\n  files = files.filter((f) =\u003e f.id !== id);\n  if (activeFileId === id) { activeFileId = null; resetFilePreview(); }\n  renderFileList();\n  showToast(\"File removed.\", \"warn\");\n}\nfunction resetFilePreview() {\n  $(\"#filePreviewEmpty\").hidden = false;\n  $(\"#filePreviewBody\").hidden = true;\n}\nfunction previewFile(id) {\n  const f = files.find((x) =\u003e x.id === id);\n  if (!f) return;\n  activeFileId = id;\n  renderFileList();\n  const words = f.isText ? f.content.trim().split(/\\s+/).filter(Boolean).length : 0;\n  const lines = f.isText ? f.content.split(\"\\n\").length : 0;\n  $(\"#filePreviewEmpty\").hidden = true;\n  const body = $(\"#filePreviewBody\");\n  body.hidden = false;\n  body.innerHTML = `\n    \u003cdiv class=\"summary-card\"\u003e\u003ch5\u003 idebar();\n}\n\nfunction deleteConversation(id) {\n  state.convos = state.convos.filter((c) =\u003e c.id !== id);\n  if (state.activeId === id) state.activeId = state.convos[0] ? state.convos[0].id : null;\n  saveToLocalStorage();\n  renderConversations();\n  renderMessages();\n  showToast(\"Conversation deleted.\", \"warn\");\n}\n\nfunction renameConversation(id) {\n  const c = state.convos.find((x) =\u003e x.id === id);\n  if (!c) return;\n  const name = prompt(\"Rename conversation:\", c.title);\n  if (name \u0026\u0026 name.trim()) {\n    c.title = name.trim();\n    saveToLocalStorage();\n    renderConversations();\n    if (id === state.activeId) $(\"#chatTitleInput\").value = c.title;\n    showToast(\"Renamed.\", \"success\");\n  }\n}\n\nfunction pinConversation(id) {\n  const c = state.convos.find((x) =\u003e x.id === id);\n  if (!c) return;\n  c.pinned = !c.pinned;\n  saveToLocalStorage();\n  renderConversations();\n}\n\nfunction favoriteConversation(id) {\n  const c = state.convos.find((x) =\u003e x.id === id);\n  if (!c) return;\n  c.favorite = !c.favorite;\n  saveToLocalStorage();\n  renderConversations();\n}\n\nfunction filterConversations() { renderConversations(); }\n\nfunction convItemHTML(c) {\n  return `\u003cdiv class=\"conv-item ${c.id === state.activeId ? \"active\" : \"\"}\" data-id=\"${c.id}\"\u003e\n    \u003cspan class=\"conv-name\"\u003e${esc(c.title)}\u003c/span\u003e\n    \u003cspan class=\"conv-actions\"\u003e\n      \u003cbutton data-act=\"pin\" title=\"Pin\"\u003e${c.pinned ? \"📌\" : \"📍\"}\u003c/button\u003e\n      \u003cbutton data-act=\"fav\" title=\"Favorite\"\u003e${c.favorite ? \"⭐\" : \"☆\"}\u003c/button\u003e\n      \u003cbutton data-act=\"rename\" title=\"Rename\"\u003e✎\u003c/button\u003e\n      \u003cbutton data-act=\"del\" title=\"Delete\"\u003e🗑\u003c/button\u003e\n    \u003c/span\u003e\n  \u003c/div\u003e`;\n}\n\nfunction renderConversations() {\n  const q = ($(\"#convSearch\").value || \"\").toLowerCase().trim();\n  const match = (c) =\u003e !q || c.title.toLowerCase().includes(q) ||\n    c.messages.some((m) =\u003e m.text.toLowerCase().includes(q));\n  const list = state.convos.filter(match);\n\n  const pinned = list.filter((c) =\u003e c.pinned);\n  const fav = list.filter((c) =\u003e c.favorite \u0026\u0026 !c.pinned);\n  const recent = list.filter((c) =\u003e !c.pinned \u0026\u0026 !c.favorite);\n\n  const fill = (arr, empty) =\u003e arr.length ? arr.map(convItemHTML).join(\"\") : `\u003cdiv class=\"conv-empty\"\u003e${empty}\u003c/div\u003e`;\n  $(\"#pinnedList\").innerHTML = fill(pinned, \"No pinned chats\");\n  $(\"#favList\").innerHTML = fill(fav, \"No favorites\");\n  $(\"#recentList\").innerHTML = fill(recent, q ? \"No matches\" : \"No recent chats\");\n}\n\n/* ---------- Messages ---------- */\nfunction renderMessages() {\n  const c = activeConvo();\n  const box = $(\"#messages\");\n  if (!c) {\n    box.innerHTML = `\u003cdiv class=\"chat-empty\"\u003e\n      \u003cdiv class=\"orb\"\u003e\u003cdiv class=\"orb-core\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-1\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-2\"\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003ch3\u003eStart a new conversation\u003c/h3\u003e\n      \u003cp\u003eAsk Nexora anything — coding help, ideas, explanations, and more.\u003c/p\u003e\n    \u003c/div\u003e`;\n    $(\"#chatTitleInput\").value = \"New Conversation\";\n    return;\n  }\n  $(\"#chatTitleInput\").value = c.title;\n  if (!c.messages.length) {\n    box.innerHTML = `\u003cdiv class=\"chat-empty\"\u003e\n      \u003cdiv class=\"orb\"\u003e\u003cdiv class=\"orb-core\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-1\"\u003e\u003c/div\u003e\u003cdiv class=\"orb-ring orb-ring-2\"\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003ch3\u003eHow can I help you today?\u003c/h3\u003e\n      \u003cp\u003eType a message below to begin. Press Enter to send, Shift+Enter for a new line.\u003c/p\u003e\n    \u003c/div\u003e`;\n    return;\n  }\n  box.innerHTML = c.messages.map(messageHTML).join(\"\");\n  bindMessageActions();\n  scrollMessages();\n}\n\nfunction messageHTML(m) {\n  if (m.role === \"user\") {\n    return `\u003cdiv class=\"msg user\" data-mid=\"${m.id}\"\u003e\n      \u003cdiv class=\"msg-avatar\"\u003eNX\u003c/div\u003e\n      \u003cdiv class=\"msg-body\"\u003e\n        \u003cdiv class=\"msg-bubble\"\u003e${formatContent(m.text)}\u003c/div\u003e\n        \u003cdiv class=\"msg-time\"\u003e${formatTime(m.ts)}\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e`;\n  }\n  return `\u003cdiv class=\"msg ai\" data-mid=\"${m.id}\"\u003e\n    \u003cdiv class=\"msg-avatar\"\u003e◆\u003c/div\u003e\n    \u003cdiv class=\"msg-body\"\u003e\n      \u003cdiv class=\"msg-model-badge\"\u003e${esc(m.model || \"NP GPT-5\")}\u003c/div\u003e\n      \u003cdiv class=\"msg-bubble\"\u003e${formatContent(m.text)}\u003c/div\u003e\n      \u003cdiv class=\"msg-actions\"\u003e\n        \u003cbutton data-act=\"copy\"\u003e⧉ Copy\u003c/button\u003e\n        \u003cbutton data-act=\"regen\"\u003e↻ Regenerate\u003c/button\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"msg-time\"\u003e${formatTime(m.ts)}\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e`;\n}\n\nfunction formatTime(ts) {\n  const d = new Date(ts || Date.now());\n  return d.toLocaleTimeString([], { hour: \"2-digit\", minute: \"2-digit\" });\n}\n\n/* Lightweight markdown-ish formatter (safe: escapes first) */\nfunction formatContent(raw) {\n  const parts = [];\n  const regex = /```(\\w*)\\n?([\\s\\S]*?)```/g;\n  let last = 0, m;\n  while ((m = regex.exec(raw)) !== null) {\n    if (m.index \u003e last) parts.push({ type: \"text\", value: raw.slice(last, m.index) });\n    parts.push({ type: \"code\", lang: m[1] || \"text\", value: m[2] });\n    last = regex.lastIndex;\n  }\n  if (last \u003c raw.length) parts.push({ type: \"text\", value: raw.slice(last) });\n\n  return parts.map((p) =\u003e {\n    if (p.type === \"code\") {\n      return `\u003cpre\u003e\u003cdiv class=\"code-head\"\u003e\u003cspan\u003e${esc(p.lang)}\u003c/span\u003e\u003cbutton class=\"mini-copy\" data-code=\"${encodeURIComponent(p.value)}\"\u003eCopy\u003c/button\u003e\u003c/div\u003e\u003ccode\u003e${esc(p.value.replace(/\\n$/, \"\"))}\u003c/code\u003e\u003c/pre\u003e`;\n    }\n    return inlineFormat(p.value);\n  }).join(\"\");\n}\n\nfunction inlineFormat(text) {\n  const lines = text.split(\"\\n\");\n  let html = \"\", inList = false;\n  for (let line of lines) {\n    let t = esc(line);\n    t = t.replace(/`([^`]+)`/g, \"\u003ccode\u003e$1\u003c/code\u003e\");\n    t = t.replace(/\\*\\*([^*]+)\\*\\*/g, \"\u003cstrong\u003e$1\u003c/strong\u003e\");\n    if (/^\\s*[-*]\\s+/.test(line)) {\n      if (!inList) { html += \"\u003cul\u003e\"; inList = true; }\n      html += `\u003cli\u003e${t.replace(/^\\s*[-*]\\s+/, \"\")}\u003c/li\u003e`;\n    } else {\n      if (inList) { html += \"\u003c/ul\u003e\"; inList = false; }\n      if (t.trim()) html += `\u003cp\u003e${t}\u003c/p\u003e`;\n    }\n  }\n  if (inList) html += \"\u003c/ul\u003e\";\n  return html;\n}\n\nfunction scrollMessages() {\n  const box = $(\"#messages\");\n  box.scrollTop = box.scrollHeight;\n}\n\nfunction addUserMessage(text) {\n  const c = activeConvo();\n  if (!c) return;\n  const msg = { id: uid(), role: \"user\", text, ts: Date.now() };\n  c.messages.push(msg);\n  if (c.messages.filter((x) =\u003e x.role === \"user\").length === 1) {\n    c.title = text.slice(0, 40) + (text.length \u003e 40 ? \"…\" : \"\");\n    $(\"#chatTitleInput\").value = c.title;\n  }\n  saveToLocalStorage();\n  renderMessages();\n  renderConversations();\n}\n\nfunction addAIMessage(text) {\n  const c = activeConvo();\n  if (!c) return;\n  const msg = { id: uid(), role: \"ai\", text, model: modelById(state.model).name, ts: Date.now() };\n  c.messages.push(msg);\n  saveToLocalStorage();\n  renderMessages();\n}\n\nlet typingEl = null;\nfunction showTypingIndicator() {\n  const box = $(\"#messages\");\n  const wrap = document.createElement(\"div\");\n  wrap.className = \"msg ai\";\n  wrap.id = \"typingIndicator\";\n  wrap.innerHTML = `\u003cdiv class=\"msg-avatar\"\u003e◆\u003c/div\u003e\u003cdiv class=\"msg-body\"\u003e\u003cdiv class=\"msg-bubble\"\u003e\u003cdiv class=\"typing\"\u003e\u003cspan\u003e\u003c/span\u003e\u003cspan\u003e\u003c/span\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`;\n  box.appendChild(wrap);\n  typingEl = wrap;\n  scrollMessages();\n}\nfunction removeTypingIndicator() {\n  if (typingEl) { typingEl.remove(); typingEl = null; }\n}\n\nlet sending = false;\nfunction sendMessage() {\n  const input = $(\"#chatInput\");\n  const text = input.value.trim();\n  if (!text || sending) return;\n  sending = true;\n  if (!activeConvo()) createConversation(false);\n\n  addUserMessage(text);\n  input.value = \"\";\n  autoGrow(input);\n  $(\"#sendBtn\").disabled = true;\n\n  showTypingIndicator();\n  const delay = 500 + Math.random() * 500;\n  setTimeout(() =\u003e {\n    removeTypingIndicator();\n    addAIMessage(generateResponse(text));\n    renderConversations();\n    sending = false;\n    $(\"#sendBtn\").disabled = false;\n    input.focus();\n  }, delay);\n}\n\nfunction copyMessage(mid) {\n  const c = activeConvo();\n  const m = c \u0026\u0026 c.messages.find((x) =\u003e x.id === mid);\n  if (!m) return;\n  navigator.clipboard.writeText(m.text).then(() =\u003e showToast(\"Message copied.\", \"success\"));\n}\n\nfunction regenerateMessage(mid) {\n  const c = activeConvo();\n  if (!c) return;\n  const idx = c.messages.findIndex((x) =\u003e x.id === mid);\n  if (idx \u003c 0) return;\n  let userText = \"\";\n  for (let i = idx - 1; i \u003e= 0; i--) { if (c.messages[i].role === \"user\") { userText = c.messages[i].text; break; } }\n  c.messages.splice(idx);\n  saveToLocalStorage();\n  renderMessages();\n  showTypingIndicator();\n  setTimeout(() =\u003e {\n    removeTypingIndicator();\n    addAIMessage(generateResponse(userText || \"Continue.\"));\n  }, 600);\n}\n\nfunction bindMessageActions() {\n  $$(\"#messages .msg-actions button\").forEach((btn) =\u003e {\n    btn.onclick = () =\u003e {\n      const mid = btn.closest(\".msg\").dataset.mid;\n      if (btn.dataset.act === \"copy\") copyMessage(mid);\n      if (btn.dataset.act === \"regen\") regenerateMessage(mid);\n    };\n  });\n  $$(\"#messages .mini-copy\").forEach((btn) =\u003e {\n    btn.onclick = () =\u003e {\n      navigator.clipboard.writeText(decodeURIComponent(btn.dataset.code)).then(() =\u003e showToast(\"Code copied.\", \"success\"));\n    };\n  });\n}\n\n/* ---------- Local response generator (no backend, no fake status text) ---------- */\nfunction generateResponse(input) {\n  const q = input.toLowerCase();\n  const model = modelById(state.model).name;\n  const web = state.webSearch ? \" Based on current web sources, \" : \" \";\n\n  if (/\\b(hi|hello|hey|yo)\\b/.test(q) \u0026\u0026 q.length \u003c 24) {\n    return `Hello! I'm running on **${model}**. Ask me to explain a concept, write code, brainstorm ideas, or draft text.`;\n  }\n  if (/\\b(code|function|component|script|program|write|build|snippet)\\b/.test(q)) {\n    if (/python/.test(q)) {\n      return `Here's a Python example:\\n\\n\\`\\`\\`python\\ndef greet(name: str) -\u003e str:\\n    return f\"Hello, {name}! Welcome to Nexora.\"\\n\\nif __name__ == \"__main__\":\\n    print(greet(\"Developer\"))\\n\\`\\`\\`\\n\\nYou can extend this with argument parsing or a loop. Want a specific variation?`;\n    }\n    if (/html|page|website/.test(q)) {\n      return `A minimal HTML starting point:\\n\\n\\`\\`\\`html\\n\u003c!DOCTYPE html\u003e\\n\u003chtml lang=\"en\"\u003e\\n  \u003chead\u003e\u003cmeta charset=\"UTF-8\" /\u003e\u003ctitle\u003eMy Page\u003c/title\u003e\u003c/head\u003e\\n  \u003cbody\u003e\\n    \u003ch1\u003eHello from Nexora\u003c/h1\u003e\\n  \u003c/body\u003e\\n\u003c/html\u003e\\n\\`\\`\\`\\n\\nPaste this into **Code Studio** to preview it live.`;\n    }\n    return `Here's a JavaScript utility you can drop in:\\n\\n\\`\\`\\`javascript\\nfunction debounce(fn, wait = 300) {\\n  let t;\\n  return (...args) =\u003e {\\n    clearTimeout(t);\\n    t = setTimeout(() =\u003e fn(...args), wait);\\n  };\\n}\\n\\`\\`\\`\\n\\nTell me the exact behavior you want and I'll tailor it.`;\n  }\n  if (/\\b(explain|what is|how does|why|difference)\\b/.test(q)) {\n    return `${web}here's a clear breakdown:\\n\\n- **Core idea:** ${input.replace(/^(explain|what is|how does|why)\\s*/i, \"\").replace(/\\?$/, \"\") || \"the topic\"} can be understood as a system of related parts.\\n- **Why it matters:** it affects how you design and reason about the problem.\\n- **In practice:** start simple, verify each step, then optimize.\\n\\nWant me to go deeper on any of these points?`;\n  }\n  if (/\\b(idea|brainstorm|suggest|name|names)\\b/.test(q)) {\n    return `Here are a few directions to consider:\\n\\n- A focused, single-purpose approach that's easy to ship.\\n- A modular version that scales as requirements grow.\\n- An experimental angle that differentiates you.\\n\\nWhich of these should I expand into a concrete plan?`;\n  }\n  if (/\\b(summary|summarize|tl;dr)\\b/.test(q)) {\n    return `**Summary:** ${input.replace(/summarize|summary|tl;dr/gi, \"\").trim() || \"your request\"} comes down to three things — clarity of goal, the smallest viable step, and a way to measure the result.`;\n  }\n  return `${web}here's my take on \"${esc(input.slice(0, 120))}\":\\n\\nThe key is to break it into concrete steps and validate each one. I can turn this into **code**, a **plan**, or a **detailed explanation** — just tell me which format works best.`;\n}\n\n/* ---------- Export / Import ---------- */\nfunction exportConversation() {\n  if (!state.convos.length) { showToast(\"Nothing to export yet.\", \"warn\"); return; }\n  const data = JSON.stringify(state.convos, null, 2);\n  const blob = new Blob([data], { type: \"application/json\" });\n  downloadBlob(blob, \"nexora-conversations.json\");\n  showToast(\"Conversations exported.\", \"success\");\n}\nfunction importConversation(json) {\n  try {\n    const parsed = JSON.parse(json);\n    if (Array.isArray(parsed)) {\n      state.convos = parsed.concat(state.convos);\n      saveToLocalStorage();\n      renderConversations();\n      renderMessages();\n      showToast(\"Conversations imported.\", \"success\");\n    }\n  } catch (e) { showToast(\"Invalid import file.\", \"warn\"); }\n}\nfunction downloadBlob(blob, filename) {\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url; a.download = filename; a.click();\n  setTimeout(() =\u003e URL.revokeObjectURL(url), 1000);\n}\n\n/* ---------- Model selector ---------- */\nfunction renderModelSelector() {\n  const menu = $(\"#modelMenu\");\n  menu.innerHTML = MODELS.map((m) =\u003e `\n    \u003cbutton class=\"model-option ${m.id === state.model ? \"selected\" : \"\"}\" data-id=\"${m.id}\" role=\"option\"\u003e\n      \u003cspan\u003e${m.name}\u003c/span\u003e\u003csmall\u003e${m.tag}\u003c/small\u003e\n    \u003c/button\u003e`).join(\"\");\n  $(\"#currentModelLabel\").textContent = modelById(state.model).name;\n  $$(\"#modelMenu .model-option\").forEach((opt) =\u003e {\n    opt.onclick = () =\u003e { switchModel(opt.dataset.id); toggleModelMenu(false); };\n  });\n}\nfunction switchModel(id) {\n  state.model = id;\n  const c = activeConvo();\n  if (c) c.model = id;\n  saveToLocalStorage();\n  renderModelSelector();\n  showToast(`Switched to ${modelById(id).name}.`, \"info\");\n}\nfunction toggleModelMenu(force) {\n  const menu = $(\"#modelMenu\");\n  const open = force !== undefined ? force : !menu.classList.contains(\"open\");\n  menu.classList.toggle(\"open\", open);\n  $(\"#modelSelectorBtn\").setAttribute(\"aria-expanded\", String(open));\n}\n\n/* ---------- Textarea auto-grow ---------- */\nfunction autoGrow(el) {\n  el.style.height = \"auto\";\n  el.style.height = Math.min(el.scrollHeight, 180) + \"px\";\n}\n\n/* ---------- Mobile sidebar ---------- */\nfunction closeMobileSidebar() {\n  $(\"#chatSidebar\").classList.remove(\"open\");\n  $(\"#sidebarScrim\").classList.remove(\"show\");\n}\n\n/* =========================================================\n   THEME\n   ========================================================= */\nfunction toggleTheme() {\n  const html = document.documentElement;\n  const next = html.getAttribute(\"data-theme\") === \"dark\" ? \"light\" : \"dark\";\n  html.setAttribute(\"data-theme\", next);\n  localStorage.setItem(STORE.theme, next);\n  $(\"#navbar\") \u0026\u0026 document.querySelector('meta[name=\"theme-color\"]').setAttribute(\"content\", next === \"dark\" ? \"#050816\" : \"#eef1f8\");\n  showToast(`${next[0].toUpperCase() + next.slice(1)} theme enabled.`, \"info\");\n}\nfunction restoreTheme() {\n  const t = localStorage.getItem(STORE.theme) || \"dark\";\n  document.documentElement.setAttribute(\"data-theme\", t);\n}\n\n/* =========================================================\n   CODE STUDIO\n   ========================================================= */\nconst codeFiles = {\n  \"index.html\": { lang: \"html\", value: `\u003c!DOCTYPE html\u003e\\n\u003chtml\u003e\\n  \u003chead\u003e\\n    \u003clink rel=\"stylesheet\" href=\"style.css\" /\u003e\\n  \u003c/head\u003e\\n  \u003cbody\u003e\\n    \u003ch1\u003eHello, Nexora!\u003c/h1\u003e\\n    \u003cbutton id=\"btn\"\u003eClick me\u003c/button\u003e\\n    \u003cscript src=\"script.js\"\u003e\u003c\\/script\u003e\\n  \u003c/body\u003e\\n\u003c/html\u003e` },\n  \"style.css\": { lang: \"css\", value: `body {\\n  font-family: system-ui, sans-serif;\\n  display: grid;\\n  place-items: center;\\n  min-height: 100vh;\\n  background: #0b1020;\\n  color: #fff;\\n}\\nbutton {\\n  padding: .6rem 1.2rem;\\n  border-radius: 10px;\\n  border: none;\\n  background: #8b5cf6;\\n  color: #fff;\\n  cursor: pointer;\\n}` },\n  \"script.js\": { lang: \"javascript\", value: `document.getElementById(\"btn\").addEventListener(\"click\", () =\u003e {\\n  alert(\"Hello from Nexora Code Studio!\");\\n});` },\n  \"main.py\": { lang: \"python\", value: `def greet(name):\\n    return f\"Hello, {name}!\"\\n\\nprint(greet(\"Nexora\"))` },\n  \"data.json\": { lang: \"json\", value: `{\\n  \"app\": \"Nexora AI\",\\n  \"version\": \"1.0.0\",\\n  \"features\": [\"chat\", \"code\", \"images\"]\\n}` },\n  \"notes.md\": { lang: \"markdown\", value: `# Nexora Notes\\n\\n- Build the dashboard\\n- Wire the chat\\n- Ship it on GitHub Pages` },\n};\nlet activeFile = \"index.html\";\n\nfunction renderCodeStudio() {\n  const names = Object.keys(codeFiles);\n  $(\"#fileTree\").innerHTML = names.map((n) =\u003e `\u003cli class=\"${n === activeFile ? \"active\" : \"\"}\" data-file=\"${n}\"\u003e📄 ${n}\u003c/li\u003e`).join(\"\");\n  $(\"#codeTabs\").innerHTML = names.map((n) =\u003e `\u003cbutton class=\"code-tab ${n === activeFile ? \"active\" : \"\"}\" data-file=\"${n}\"\u003e${n}\u003c/button\u003e`).join(\"\");\n  $(\"#codeEditor\").value = codeFiles[activeFile].value;\n  updateLineNumbers();\n  runCode();\n}\nfunction selectFile(name) {\n  activeFile = name;\n  renderCodeStudio();\n}\nfunction updateLineNumbers() {\n  const lines = $(\"#codeEditor\").value.split(\"\\n\").length;\n  $(\"#lineNumbers\").innerHTML = Array.from({ length: lines }, (_, i) =\u003e i + 1).join(\"\u003cbr\u003e\");\n}\nfunction runCode() {\n  const html = codeFiles[\"index.html\"].value\n    .replace(/\u003clink[^\u003e]*href=\"style\\.css\"[^\u003e]*\u003e/, `\u003cstyle\u003e${codeFiles[\"style.css\"].value}\u003c\\/style\u003e`)\n    .replace(/\u003cscript[^\u003e]*src=\"script\\.js\"[^\u003e]*\u003e\u003c\\/script\u003e/, `\u003cscript\u003e${codeFiles[\"script.js\"].value}\u003c\\/script\u003e`);\n  $(\"#previewFrame\").srcdoc = html;\n}\n\n/* =========================================================\n   IMAGE STUDIO\n   ========================================================= */\nfunction hashStr(s) { let h = 0; for (let i = 0; i \u003c s.length; i++) { h = (h \u003c\u003c 5) - h + s.charCodeAt(i); h |= 0; } return Math.abs(h); }\n\nfunction styleColors(style, seed) {\n  const palettes = {\n    Realistic: [\"#4b6cb7\", \"#182848\"], Anime: [\"#ff9a9e\", \"#a18cd1\"], Minecraft: [\"#43a047\", \"#795548\"],\n    \"Pixel Art\": [\"#ff6b6b\", \"#4ecdc4\"], Fantasy: [\"#8e2de2\", \"#4a00e0\"], Cyberpunk: [\"#f72585\", \"#4361ee\"],\n    Cinematic: [\"#ff512f\", \"#dd2476\"], Cartoon: [\"#f7971e\", \"#ffd200\"],\n  };\n  const base = palettes[style] || [\"#8b5cf6\", \"#06b6d4\"];\n  const angle = seed % 360;\n  return `linear-gradient(${angle}deg, ${base[0]}, ${base[1]})`;\n}\n\nfunction styleArt(style) {\n  const map = {\n    Realistic: \"realistic\", Anime: \"anime\", Minecraft: \"minecraft\", \"Pixel Art\": \"pixel\",\n    Fantasy: \"fantasy\", Cyberpunk: \"cyberpunk\", Cinematic: \"cinematic\", Cartoon: \"cartoon\",\n  };\n  return `images/style-${map[style] || \"realistic\"}.png`;\n}\n\nfunction generateImages() {\n  const prompt = $(\"#imagePrompt\").value.trim();\n  const style = $(\"#imageStyle\").value;\n  if (!prompt) { showToast(\"Enter a prompt first.\", \"warn\"); $(\"#imagePrompt\").focus(); return; }\n\n  const results = $(\"#imageResults\");\n  results.innerHTML = \"\";\n  const cards = [];\n  for (let i = 0; i \u003c 4; i++) {\n    const card = document.createElement(\"div\");\n    card.className = \"image-card loading\";\n    card.innerHTML = `\u003cdiv class=\"art\"\u003e\u003c/div\u003e`;\n    results.appendChild(card);\n    cards.push(card);\n  }\n  const art = styleArt(style);\n  cards.forEach((card, i) =\u003e {\n    setTimeout(() =\u003e {\n      const seed = hashStr(prompt + style + i);\n      const grad = styleColors(style, seed + i * 47);\n      const hue = (seed % 60) - 30;\n      const scale = 1 + ((seed % 12) / 100);\n      card.classList.remove(\"loading\");\n      card.innerHTML = `\n        \u003cdiv class=\"art\"\u003e\n          \u003cimg src=\"${art}\" alt=\"${esc(style)} concept art for: ${esc(prompt)}\"\n               style=\"filter:hue-rotate(${hue}deg) saturate(1.1);transform:scale(${scale});\" /\u003e\n          \u003cdiv class=\"art-tint\" style=\"background:${grad}\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"img-meta\"\u003e\n          \u003cspan\u003e${style} · v${i + 1}\u003c/span\u003e\n          \u003cbutton class=\"img-download\"\u003e⭳ Save\u003c/button\u003e\n        \u003c/div\u003e`;\n      card.querySelector(\".img-download\").onclick = () =\u003e downloadImageCard(card, prompt, i);\n    }, 500 + i * 350);\n  });\n\n  saveImagePrompt(prompt, style);\n  showToast(\"Rendering 4 variations…\", \"info\");\n}\n\nfunction downloadImageCard(card, prompt, i) {\n  const imgEl = card.querySelector(\".art img\");\n  const cvs = document.createElement(\"canvas\");\n  cvs.width = 512; cvs.height = 512;\n  const ctx = cvs.getContext(\"2d\");\n  const render = () =\u003e {\n    try { ctx.drawImage(imgEl, 0, 0, 512, 512); } catch (e) {\n      ctx.fillStyle = \"#8b5cf6\"; ctx.fillRect(0, 0, 512, 512);\n    }\n    const bar = ctx.createLinearGradient(0, 440, 0, 512);\n    bar.addColorStop(0, \"rgba(0,0,0,0)\"); bar.addColorStop(1, \"rgba(0,0,0,0.75)\");\n    ctx.fillStyle = bar; ctx.fillRect(0, 440, 512, 72);\n    ctx.fillStyle = \"rgba(255,255,255,0.9)\"; ctx.font = \"600 20px sans-serif\";\n    ctx.fillText(\"Nexora AI\", 24, 490);\n    cvs.toBlob((blob) =\u003e downloadBlob(blob, `nexora-${i + 1}.png`));\n    showToast(\"Image saved.\", \"success\");\n  };\n  if (imgEl \u0026\u0026 imgEl.complete) render();\n  else if (imgEl) imgEl.addEventListener(\"load\", render, { once: true });\n}\n\nfunction saveImagePrompt(prompt, style) {\n  let hist = [];\n  try { hist = JSON.parse(localStorage.getItem(STORE.imgHistory) || \"[]\"); } catch (e) {}\n  hist.unshift({ prompt, style, ts: Date.now() });\n  hist = hist.slice(0, 15);\n  localStorage.setItem(STORE.imgHistory, JSON.stringify(hist));\n  renderPromptHistory();\n}\nfunction renderPromptHistory() {\n  let hist = [];\n  try { hist = JSON.parse(localStorage.getItem(STORE.imgHistory) || \"[]\"); } catch (e) {}\n  const box = $(\"#promptHistory\");\n  if (!hist.length) { box.innerHTML = `\u003cdiv class=\"conv-empty\"\u003eNo prompts yet.\u003c/div\u003e`; return; }\n  box.innerHTML = hist.map((h) =\u003e `\u003cbutton class=\"prompt-history-item\" data-prompt=\"${esc(h.prompt)}\" data-style=\"${esc(h.style)}\"\u003e${esc(h.prompt.slice(0, 48))}\u003c/button\u003e`).join(\"\");\n  $$(\"#promptHistory .prompt-history-item\").forEach((b) =\u003e {\n    b.onclick = () =\u003e { $(\"#imagePrompt\").value = b.dataset.prompt; $(\"#imageStyle\").value = b.dataset.style; };\n  });\n}\n\n/* =========================================================\n   FILE INTELLIGENCE\n   ========================================================= */\nlet files = [];\nfunction fileIcon(type, name) {\n  const ext = (name.split(\".\").pop() || \"\").toLowerCase();\n  if (/png|jpg|jpeg|gif|webp/.test(ext)) return \"🖼️\";\n  if (ext === \"pdf\") return \"📕\";\n  if (/docx?|txt|md/.test(ext)) return \"📝\";\n  if (ext === \"csv\") return \"📊\";\n  if (ext === \"json\") return \"🧾\";\n  return \"📄\";\n}\nfunction humanSize(bytes) {\n  if (bytes \u003c 1024) return bytes + \" B\";\n  if (bytes \u003c 1024 * 1024) return (bytes / 1024).toFixed(1) + \" KB\";\n  return (bytes / 1024 / 1024).toFixed(1) + \" MB\";\n}\nfunction handleFiles(fileList) {\n  [...fileList].forEach((f) =\u003e {\n    const entry = { id: uid(), name: f.name, size: f.size, type: f.type, ext: (f.name.split(\".\").pop() || \"\").toLowerCase(), content: \"\", isText: false };\n    if (/text|json|csv|javascript/.test(f.type) || /txt|md|csv|json|js|css|html/.test(entry.ext)) {\n      const reader = new FileReader();\n      reader.onload = (e) =\u003e { entry.content = e.target.result; entry.isText = true; renderFileList(); };\n      reader.readAsText(f);\n    }\n    files.push(entry);\n  });\n  renderFileList();\n  showToast(`${fileList.length} file(s) added.`, \"success\");\n}\nlet activeFileId = null;\nfunction renderFileList() {\n  const q = ($(\"#fileSearch\").value || \"\").toLowerCase();\n  const box = $(\"#fileList\");\n  const list = files.filter((f) =\u003e f.name.toLowerCase().includes(q));\n  if (!list.length) { box.innerHTML = `\u003cdiv class=\"conv-empty\"\u003e${files.length ? \"No matches.\" : \"No files yet.\"}\u003c/div\u003e`; return; }\n  box.innerHTML = list.map((f) =\u003e `\n    \u003cdiv class=\"file-item ${f.id === activeFileId ? \"active\" : \"\"}\" data-id=\"${f.id}\"\u003e\n      \u003cdiv class=\"file-ico\"\u003e${fileIcon(f.type, f.name)}\u003c/div\u003e\n      \u003cdiv class=\"file-meta\"\u003e\u003ch4\u003e${esc(f.name)}\u003c/h4\u003e\u003cspan\u003e${humanSize(f.size)} · ${f.ext.toUpperCase()}\u003c/span\u003e\u003c/div\u003e\n      \u003cbutton class=\"file-remove\" data-remove=\"${f.id}\" title=\"Remove\"\u003e✕\u003c/button\u003e\n    \u003c/div\u003e`).join(\"\");\n  $$(\"#fileList .file-item\").forEach((el) =\u003e {\n    el.onclick = (e) =\u003e { if (e.target.dataset.remove) return; previewFile(el.dataset.id); };\n  });\n  $$(\"#fileList .file-remove\").forEach((b) =\u003e {\n    b.onclick = (e) =\u003e { e.stopPropagation(); removeFile(b.dataset.remove); };\n  });\n}\nfunction removeFile(id) {\n  files = files.filter((f) =\u003e f.id !== id);\n  if (activeFileId === id) { activeFileId = null; resetFilePreview(); }\n  renderFileList();\n  showToast(\"File removed.\", \"warn\");\n}\nfunction resetFilePreview() {\n  $(\"#filePreviewEmpty\").hidden = false;\n  $(\"#filePreviewBody\").hidden = true;\n}\nfunction previewFile(id) {\n  const f = files.find((x) =\u003e x.id === id);\n  if (!f) return;\n  activeFileId = id;\n  renderFileList();\n  const words = f.isText ? f.content.trim().split(/\\s+/).filter(Boolean).length : 0;\n  const lines = f.isText ? f.content.split(\"\\n\").length : 0;\n  $(\"#filePreviewEmpty\").hidden = true;\n  const body = $(\"#filePreviewBody\");\n  body.hidden = false;\n  body.innerHTML = `\n    \u003cdiv class=\"summary-card\"\u003e\u003ch5\u003eAI Summary\u003c/h5\u003e\u003cp\u003e${summaryFor(f, words)}\u003c/p\u003e\u003c/div\u003e\n    \u003cdiv class=\"summary-card\"\u003e\u003ch5\u003eDetails\u003c/h5\u003e\u003cp\u003eType: ${f.ext.toUpperCase()} · Size: ${humanSize(f.size)}${f.isText ? ` · ${words} words · ${lines} lines` : \"\"}\u003c/p\u003e\u003c/div\u003e\n    ${f.isText ? `\u003cp class=\"field-label\"\u003eContent preview\u003c/p\u003e\u003cdiv class=\"file-content-preview\"\u003e${esc(f.content.slice(0, 4000)) || \"(empty file)\"}\u003c/div\u003e` : `\u003cdiv class=\"summary-card\"\u003e\u003ch5\u003ePreview\u003c/h5\u003e\u003cp\u003eBinary file — text extraction is available for TXT, MD, CSV, JSON, and code files in the browser.\u003c/p\u003e\u003c/div\u003e`}`;\n}\nfunction summaryFor(f, words) {\n  if (f.ext === \"json\") return \"Structured JSON detected. Nexora can map keys, validate schema, and flag anomalies.\";\n  if (f.ext === \"csv\") return \"Tabular CSV detected. Nexora can profile columns, count rows, and surface outliers.\";\n  if (/txt|md/.test(f.ext)) return `Text document with roughly ${words} words. Key themes and a TL;DR can be generated on request.`;\n  if (/png|jpg|jpeg/.test(f.ext)) return \"Image file detected. Nexora can describe contents and extract on-screen text.\";\n  if (f.ext === \"pdf\") return \"PDF document detected. Nexora can extract sections, tables, and a concise summary.\";\n  return \"File added. Ask Nexora to summarize, extract, or transform its contents.\";\n}\n\n/* =========================================================\n   API DASHBOARD\n   ========================================================= */\nfunction genKey() {\n  const chars = \"abcdefghijklmnopqrstuvwxyz0123456789\";\n  let s = \"\";\n  for (let i = 0; i \u003c 32; i++) s += chars[Math.floor(Math.random() * chars.length)];\n  return \"nxr_sk_live_\" + s;\n}\nfunction createKey() {\n  const key = { id: uid(), name: \"Key \" + (state.keys.length + 1), value: genKey(), created: Date.now(), lastUsed: \"Never\", requests: 0, revealed: true };\n  state.keys.unshift(key);\n  saveToLocalStorage();\n  renderKeys();\n  showToast(\"New API key created.\", \"success\");\n}\nfunction regenerateKey(id) {\n  const k = state.keys.find((x) =\u003e x.id === id);\n  if (!k) return;\n  k.value = genKey();\n  saveToLocalStorage();\n  renderKeys();\n  showToast(\"Key regenerated.\", \"info\");\n}\nfunction deleteKey(id) {\n  state.keys = state.keys.filter((k) =\u003e k.id !== id);\n  saveToLocalStorage();\n  renderKeys();\n  showToast(\"Key deleted.\", \"warn\");\n}\nfunction copyKey(id) {\n  const k = state.keys.find((x) =\u003e x.id === id);\n  if (k) navigator.clipboard.writeText(k.value).then(() =\u003e showToast(\"API key copied.\", \"success\"));\n}\nfunction renderKeys() {\n  const box = $(\"#keyList\");\n  if (!state.keys.length) { box.innerHTML = `\u003cdiv class=\"conv-empty\"\u003eNo keys yet. Create your first key.\u003c/div\u003e`; }\n  else {\n    box.innerHTML = state.keys.map((k) =\u003e `\n      \u003cdiv class=\"key-row\"\u003e\n        \u003cdiv class=\"key-top\"\u003e\n          \u003cspan class=\"key-name\"\u003e${esc(k.name)}\u003c/span\u003e\n          \u003cspan class=\"key-actions\"\u003e\n            \u003cbutton data-copy=\"${k.id}\"\u003eCopy\u003c/button\u003e\n            \u003cbutton data-regen=\"${k.id}\"\u003eRegenerate\u003c/button\u003e\n            \u003cbutton data-del=\"${k.id}\"\u003eDelete\u003c/button\u003e\n          \u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"key-value\"\u003e${esc(k.value.slice(0, 16))}${\"•\".repeat(12)}${esc(k.value.slice(-4))}\u003c/div\u003e\n        \u003cdiv class=\"key-meta\"\u003eCreated
